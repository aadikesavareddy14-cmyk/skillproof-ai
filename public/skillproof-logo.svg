<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" fill="none">
  <defs>
    <linearGradient id="sp-top" x1="18" y1="16" x2="82" y2="53" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="sp-left" x1="18" y1="34" x2="50" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="sp-right" x1="50" y1="53" x2="82" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="60%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="sp-glow" cx="50" cy="50" r="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#2563eb" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ai-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="cube-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#2563eb" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Cube Icon scaled to 60x60, offset (10, 10) -->
  <g transform="translate(10, 10) scale(0.6)">
    <circle cx="50" cy="50" r="42" fill="url(#sp-glow)"/>
    <g filter="url(#cube-shadow)">
      <polygon points="50,16 82,34.5 50,53 18,34.5" fill="url(#sp-top)" stroke="#7dd3fc" stroke-width="0.8" stroke-linejoin="round"/>
      <polygon points="18,34.5 50,53 50,84 18,65.5" fill="url(#sp-left)" stroke="#60a5fa" stroke-width="0.8" stroke-linejoin="round"/>
      <polygon points="50,53 82,34.5 82,65.5 50,84" fill="url(#sp-right)" stroke="#3b82f6" stroke-width="0.8" stroke-linejoin="round"/>
      <polygon points="50,29 67,38.8 50,48.6 33,38.8" fill="#ffffff" fill-opacity="0.22"/>
      <polygon points="33,38.8 50,48.6 50,65.5 33,55.7" fill="#ffffff" fill-opacity="0.1"/>
      <polygon points="50,48.6 67,38.8 67,55.7 50,65.5" fill="#000000" fill-opacity="0.18"/>
      <circle cx="50" cy="53" r="2.5" fill="#e0f2fe"/>
      <circle cx="50" cy="53" r="1.2" fill="#ffffff"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="82" y="48" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.02em">
    <tspan fill="#ffffff">SkillProof</tspan>
    <tspan fill="url(#ai-grad)" dx="5">AI</tspan>
  </text>
</svg>
